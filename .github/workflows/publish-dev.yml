name: Publish drp-dev to PyPI

# Dev branch → publishes "drp-dev" package.
# No tags, no GitHub releases — just PyPI.

on:
  push:
    branches: [dev]
    paths:
      - 'cli/**'
      - 'pyproject.toml'
      - 'VERSION'
      - '.github/workflows/publish-dev.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pipx
        run: pip install pipx

      - name: Install package with pipx
        run: pipx install .

      - name: Install package editable for pytest (pipx env is isolated)
        run: pip install -e ".[dev]"

      - name: Check drp entrypoint is on PATH
        run: drp --help || drp

      - name: Check fallback python -m cli.main also works
        run: python -m cli.main --help || true

      - name: Run unit tests
        env:
          DB_URL: ""
        run: python -m pytest tests/unit/ -v

      # ── Smoke tests (require DRP_SMOKE_HOST secret) ───────────────────────


  # ── Publish drp-dev (no tags, no releases) ────────────────────────────────

  publish:
    # needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute version from PyPI
        id: version
        run: |
          base=$(cat VERSION | tr -d '[:space:]')
          pkg="drp-dev"
          latest=$(curl -sf "https://pypi.org/pypi/${pkg}/json" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "")
          if [ -n "$latest" ] && echo "$latest" | grep -q "^${base}\."; then
            patch=$(echo "$latest" | cut -d. -f3)
            version="${base}.$((patch + 1))"
          else
            version="${base}.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing ${pkg} ${version} (latest on PyPI: ${latest:-none})"

      - name: Stamp version
        run: echo '${{ steps.version.outputs.version }}' > VERSION

      - name: Stamp __version__ in cli/__init__.py
        run: echo "__version__ = '${{ steps.version.outputs.version }}'" > cli/__init__.py

      - name: Build drp-dev
        run: pip install build && python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}