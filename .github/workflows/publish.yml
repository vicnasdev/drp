name: Publish drp to PyPI

# Main branch → publishes "drp" package.
# Creates Git tags and GitHub releases.

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'pyproject.toml'
      - 'VERSION'
      - '.github/workflows/publish.yml'

permissions:
  contents: write

jobs:

  # ── Publish drp (with tags + GitHub releases) ─────────────────────────────
  # PyPI publish will fail until "drp" package name is acquired.
  # Release is created only after successful publish.

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute version from PyPI
        id: version
        run: |
          base=$(cat VERSION | tr -d '[:space:]')
          pkg="drp"
          latest=$(curl -sf "https://pypi.org/pypi/${pkg}/json" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "")
          if [ -n "$latest" ] && echo "$latest" | grep -q "^${base}\."; then
            patch=$(echo "$latest" | cut -d. -f3)
            version="${base}.$((patch + 1))"
          else
            version="${base}.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing ${pkg} ${version} (latest on PyPI: ${latest:-none})"

      - name: Stamp version
        run: echo '${{ steps.version.outputs.version }}' > VERSION

      - name: Stamp __version__ in cli/__init__.py
        run: echo "__version__ = '${{ steps.version.outputs.version }}'" > cli/__init__.py

      - name: Build "drp" package
        run: |
          # Override package name from drp-dev → drp at build time
          sed -i 's/^name = "drp-dev"/name = "drp"/' pyproject.toml
          # Use main README for stable PyPI page (not dev warning readme)
          sed -i 's/^readme = "PYPI_DEV_README.md"/readme = "README.md"/' pyproject.toml
          pip install build && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Collect commits since last release
        run: |
          prev_tag=$(git tag --sort=-v:refname | head -1)
          if [ -z "$prev_tag" ]; then
            log=$(git log --oneline --no-decorate HEAD)
          else
            log=$(git log --oneline --no-decorate "$prev_tag"..HEAD)
          fi
          {
            echo "$log"
            echo ""
            echo "Install / upgrade:"
            echo '```'
            echo 'pipx install drp'
            echo '# or upgrade:'
            echo 'pipx upgrade drp'
            echo '```'
          } > /tmp/release_notes.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.txt