[tool.pytest.ini_options]
# ── Test layout ────────────────────────────────────────────────────────────────
# 
#   tests/unit/         Fast unit tests — no server, no real DB.
#                       Run with: pytest tests/unit/
#
#   tests/integration/  Integration tests against a real running server + DB.
#                       Require the server to be running and .env to have DB_URL.
#                       Run with: pytest tests/integration/
#
#   Run all:            pytest tests/
#
testpaths = ["tests/unit", "tests/integration"]
DJANGO_SETTINGS_MODULE = "project.settings"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drp-dev"
dynamic = ["version"]
description = "Drop text and files from the command line — get a link instantly."
readme = "PYPI_DEV_README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "cmd2>=2.4",
    "requests>=2.28",
    "rich>=13.0",
    "pygments>=2.14",
    "keyring>=25.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "platformdirs>=4.0",
]
authors = [{name = "Vic Nas"}]
keywords = ["cli", "file-sharing", "pastebin", "drops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.optional-dependencies]
completion = ["argcomplete>=3.1"]
dev = [
    "pytest",
    "pytest-django",
    "pytest-asyncio",
    "pytest-cov",
    "django>=5.0",
    "python-dotenv",
    "dj-database-url",
    "whitenoise",
    "gunicorn",
    "requests",
    "psycopg2-binary>=2.9",
    "boto3",
    "markdown",
    "pygments>=2.14",
    "reportlab",
    "argcomplete>=3.1",
]

[project.urls]
Homepage   = "https://drp.fyi"
Repository = "https://github.com/vicnasdev/drp"
Issues     = "https://github.com/vicnasdev/drp/issues"

[project.scripts]
drp = "cli.main:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["cli*"]